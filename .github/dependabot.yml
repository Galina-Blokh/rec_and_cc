# Weekly dependency updates. Minor and patch bumps are grouped into one PR per ecosystem;
# major bumps come as separate PRs. Pinned action SHAs are updated together with their
# `# vX` comments. Model revisions (src/recandcc/transcribe/revisions.py) and the Cursor agent
# (cursor-review.yml) are not covered and are bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # sherpa-onnx pins sherpa-onnx-core to its exact version: always bump them together.
      sherpa-onnx:
        patterns: ["sherpa-onnx", "sherpa-onnx-core"]
      python-minor-patch:
        update-types: [minor, patch]
