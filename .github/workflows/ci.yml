name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --only-dev ruff check .
      - run: uv run --only-dev ruff format --check src tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build macOS helper
        if: runner.os == 'macOS'
        run: ./native/macos/build.sh
      - name: Unit tests (fast; model-free)
        run: uv run pytest -v
