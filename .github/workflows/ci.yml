name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supply chain: actions are pinned to commit SHAs (Dependabot bumps them, see
# .github/dependabot.yml) and every `uv` call uses --locked, so CI fails instead of silently
# resolving dependencies that differ from uv.lock.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run --locked --only-dev ruff check .
      - run: uv run --locked --only-dev ruff format --check src tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install (exactly as locked)
        run: uv sync --locked
      - name: Build macOS helper
        if: runner.os == 'macOS'
        run: ./native/macos/build.sh
      - name: Unit tests (fast; model-free)
        run: uv run --locked pytest -v
