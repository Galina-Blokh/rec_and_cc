[project]
name = "recandcc"
version = "0.1.0"
description = "Local, private, always-on recorder + transcriber for calls, meetings and videos (macOS & Windows)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "comtypes>=1.4.17 ; sys_platform == 'win32'",
    "faster-whisper>=1.2.1",
    "fpdf2>=2.8.9",
    "mlx-whisper>=0.4.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "numpy>=2.5.4",
    "pillow>=13.0.0 ; sys_platform == 'win32'",
    "platformdirs>=4.13.5",
    "pyaudiowpatch>=0.2.12.9 ; sys_platform == 'win32'",
    "pycaw>=20260927 ; sys_platform == 'win32'",
    "pystray>=0.19.5 ; sys_platform == 'win32'",
    "python-docx>=1.2.0",
    "rumps>=0.4.0 ; sys_platform == 'darwin'",
    "sherpa-onnx==2.0.0",
    "sherpa-onnx-core==2.0.0",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "tomli-w>=1.2.0",
    "uharfbuzz>=0.57.0",
]

[project.scripts]
recandcc = "recandcc:main"
rcc = "recandcc:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.uv]
# mlx-whisper declares torch, but only its unused mlx_whisper/torch_whisper.py imports it;
# RecAndCC never loads it (tests/test_no_torch.py). Excluding it drops ~0.57 GB of torch,
# sympy, networkx, mpmath, jinja2, markupsafe and setuptools. numba (with llvmlite) and
# scipy are imported only by mlx_whisper/timing.py for word timestamps, which RecAndCC never
# requests; transcribe/gpu.py stubs that module before importing mlx_whisper. See ADR 0011,
# follow-up 4.
exclude-dependencies = ["torch", "numba", "scipy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# S = flake8-bandit (security). Production hits are fixed or carry an inline
# `# noqa: S... - reason`; the exceptions below are reviewed and scoped per file.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests: pytest asserts; fixed-argv calls to macOS tools (say, afconvert, the built helper);
# "/tmp/x" literals are fake paths that are never opened.
"tests/**" = ["S101", "S603", "S607", "S108"]
# UI openers / dialogs: fixed argv lists without a shell (open, xdg-open, notepad.exe,
# osascript with an AppleScript built from escaped strings, os.startfile with a constant URI
# or a path we created); S112 skips an unreadable session.json. To be moved to inline noqa
# comments with the next ui/ change.
"src/recandcc/ui/common.py" = ["S603", "S606", "S607", "S112"]
"src/recandcc/ui/mac.py" = ["S603", "S607"]
"src/recandcc/ui/tray.py" = ["S606", "S607"]
# Report scripts build HTML from long template strings; E501 there hurts readability.
"scripts/report/*.py" = ["E501"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The coverage floor is enforced in CI only: `--cov-fail-under` in .github/workflows/ci.yml.
addopts = "-m 'not slow' --cov --cov-report=term-missing:skip-covered"
markers = ["slow: downloads Whisper models / runs real inference (run with -m slow)"]

[tool.coverage.run]
source = ["recandcc"]
# UI shells (AppKit / pystray, exercised by hand) and the CLI entry points are not counted;
# their testable logic lives in ui/common.py and ui/captions.py, which are.
omit = [
    "*/recandcc/__main__.py",
    "*/recandcc/cli.py",
    "*/recandcc/ui/mac.py",
    "*/recandcc/ui/tray.py",
    "*/recandcc/ui/captions_mac.py",
    "*/recandcc/ui/toast_mac.py",
]


