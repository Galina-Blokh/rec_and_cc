[project]
name = "recandcc"
version = "0.1.0"
description = "Local, private, always-on recorder + transcriber for calls, meetings and videos (macOS & Windows)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "comtypes>=1.4.17 ; sys_platform == 'win32'",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0 ; sys_platform == 'win32'",
    "platformdirs>=4.13.5",
    "pyaudiowpatch>=0.2.12.9 ; sys_platform == 'win32'",
    "pycaw>=20260927 ; sys_platform == 'win32'",
    "pystray>=0.19.5 ; sys_platform == 'win32'",
    "rumps>=0.4.0 ; sys_platform == 'darwin'",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "tomli-w>=1.2.0",
]

[project.scripts]
recandcc = "recandcc:main"
rcc = "recandcc:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: downloads Whisper models / runs real inference (run with -m slow)"]
